on:
  push:
    tags:
      - "*"
    branches:
      - develop
      - main
  pull_request:
    branches: ["**"]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: 'mango_docs'

jobs:
  build_mango_docs:
    name: Build MANGO Docs
    environment: mango_docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Install dependencies
        run: |
          npm ci
          echo "MANGO_HOST_URL=${{ secrets.MANGO_HOST_URL }}" >> $GITHUB_ENV
        shell: bash

      - name: Build application
        run: |
          npm run build
        shell: bash

  build_image:
    name: Build Image
    environment: mango_docs
    runs-on: ubuntu-24.04
    needs: [build_mango_docs]
    if: |
      needs.build_mango_docs.result == 'success' &&
      (
        github.ref == 'refs/heads/develop' ||
        startsWith(github.ref, 'refs/tags/')
      )
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4

      - name: Create env variable of lowercase GitHub repo name
        run: |
            GITHUB_REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
            echo "GITHUB_REPO_LOWER=$GITHUB_REPO_LOWER" >>${GITHUB_ENV}
        shell: bash

      - name: Set image tag environment variable
        run: |
          GITHUB_REF_NAME_CLEAN="${GITHUB_REF_NAME//\//_}"
          echo "GITHUB_REF_NAME_CLEAN=$GITHUB_REF_NAME_CLEAN" >>${GITHUB_ENV}

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.GITHUB_REPO_LOWER }}
          tags: ${{ env.GITHUB_REF_NAME_CLEAN }}
          containerfiles: |
            ./Containerfile

      - name: Push to GitHub Container Registry
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
